# Dựng và đăng toàn bộ website GeGe Team lên GitHub Pages:
#   /                    trang chủ (repo này)
#   /games/poe-1/        TanHoang2002/web_POE1
#   /games/aion-2/       TanHoang2002/gegeteam-webAion2 (build bằng Vite)
#   /games/blox-fruits/  TanHoang2002/gegeteam-blox-fruits
#   /games/wow-forever/  TanHoang2002/gegeteam-wow-forever
# Mỗi lần chạy cũng lấy tin mới (scripts/update_news.py).
# Chạy khi push lên main, mỗi giờ một lần (để nhận thay đổi của các repo game và tin mới),
# hoặc bấm tay: tab Actions > Deploy site > Run workflow.
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch news
        continue-on-error: true
        run: |
          pip install pillow
          python scripts/update_news.py
          git add js/news-auto.js assets/news/auto
          if ! git diff --cached --quiet; then
            git config user.name "gegeteam-news-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto-update news"
            git push
          fi

      - uses: actions/checkout@v4
        with: { repository: TanHoang2002/web_POE1, path: _src/poe-1 }
      - uses: actions/checkout@v4
        with: { repository: TanHoang2002/gegeteam-webAion2, path: _src/aion-2 }
      - uses: actions/checkout@v4
        with: { repository: TanHoang2002/gegeteam-blox-fruits, path: _src/blox-fruits }
      - uses: actions/checkout@v4
        with: { repository: TanHoang2002/gegeteam-wow-forever, path: _src/wow-forever }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: _src/aion-2/package-lock.json

      - name: Build AION 2
        working-directory: _src/aion-2
        run: npm ci && npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/games
          cp -r index.html css js assets _site/
          for g in poe-1 blox-fruits wow-forever; do
            rsync -a --exclude '.git*' --exclude 'README*' --exclude '.github' "_src/$g/" "_site/games/$g/"
          done
          cp -r _src/aion-2/dist _site/games/aion-2
          [ -f CNAME ] && cp CNAME _site/ || true
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
