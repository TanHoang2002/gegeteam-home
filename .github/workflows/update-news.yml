# Tự lấy tin mới của POE 1, AION 2 và WoW Forever, đăng lên trang chủ.
# Chạy 3 tiếng một lần; muốn chạy ngay: tab Actions > Update news > Run workflow.
name: Update news

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Fetch news
        run: python scripts/update_news.py

      - name: Commit if changed
        run: |
          git add js/news-auto.js assets/news/auto
          if git diff --cached --quiet; then
            echo "Không có tin mới"
            exit 0
          fi
          git config user.name "gegeteam-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-update news"
          git push
